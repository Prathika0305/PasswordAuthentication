<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
        }

        .center {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            color: black;
            padding: 30px;
            border-radius: 15px;
            width: 320px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.4);
            text-align: center;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            background: #203a43;
            color: white;
            border: none;
            padding: 10px 20px;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #0f2027;
        }

        a {
            text-decoration: none;
            color: #203a43;
        }
    </style>

</head>

<body>
    {% block content %}{% endblock %}
</body>
</html>
