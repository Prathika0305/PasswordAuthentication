{% extends "base.html" %}

{% block content %}

<div class="center">

<div class="card">

<h2>Login</h2>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<form method="POST">

<input
type="text"
name="username"
placeholder="Username"
required>

<input
type="password"
id="password"
name="password"
placeholder="Password"
required>

<button
type="button"
onclick="togglePassword()">
Show / Hide Password
</button>

<br><br>

<button type="submit">
Login
</button>

</form>

<p>
<a href="/register">
Create Account
</a>
</p>

</div>

</div>

<script>

function togglePassword(){

let x=document.getElementById("password");

if(x.type==="password"){
x.type="text";
}else{
x.type="password";
}

}

</script>

{% endblock %}
